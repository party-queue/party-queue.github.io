<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Queue</title>
<meta name="description" content="Party Queue – a party jukebox for Android. / Imprezowy jukebox na Androida.">
<link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
<link rel="alternate" hreflang="en" href="https://party-queue.github.io/en/">
<link rel="alternate" hreflang="pl" href="https://party-queue.github.io/pl/">
<link rel="alternate" hreflang="x-default" href="https://party-queue.github.io/">
<meta property="og:title" content="Party Queue">
<meta property="og:image" content="https://party-queue.github.io/assets/img/screens/web-queue-dark.jpg">
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#130a26; color:#f3ecff; font:18px/1.5 system-ui,sans-serif; text-align:center; padding:24px }
img { width:96px; height:96px; border-radius:26px; box-shadow:0 10px 34px #7c3aed77 }
h1 { margin:18px 0 6px; font-size:40px }
a.b { display:inline-block; margin:8px; padding:10px 14px; border-radius:18px; background:linear-gradient(120deg,#ff2e93,#7c3aed 55%,#22b8ff); line-height:0 }
.flag { width:84px; height:56px; border-radius:8px; box-shadow:0 0 0 2px #fff6; display:block }
</style>
</head>
<body>
<div>
  <img src="assets/img/icon.svg" alt="">
  <h1>Party Queue</h1>
  <p>One phone. One queue. Everyone's songs.<br>Jeden telefon. Jedna kolejka. Piosenki wszystkich.</p>
  <p><a class="b" href="en/" hreflang="en" title="English" aria-label="English"><svg class="flag" viewBox="0 0 60 30" aria-hidden="true" focusable="false"><clipPath id="fs"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ft"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#fs)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ft)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg></a><a class="b" href="pl/" hreflang="pl" title="Polski" aria-label="Polski"><svg class="flag" viewBox="0 0 8 5" aria-hidden="true" focusable="false"><rect width="8" height="5" fill="#fff"/><rect y="2.5" width="8" height="2.5" fill="#dc143c"/></svg></a></p>
</div>
<script>
  // Go straight to the visitor's language (the choice made on a page is remembered).
  try {
    var saved = localStorage.getItem('pqLang');
    var l = saved || ((navigator.language || 'en').toLowerCase().indexOf('pl') === 0 ? 'pl' : 'en');
    if (location.search.indexOf('choose') < 0) location.replace(l + '/');
  } catch (e) { /* the buttons above still work */ }
</script>
</body>
</html>
